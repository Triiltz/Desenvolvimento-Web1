<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title th:text="${aluno.id == null} ? #{aluno.cadastro.titulo} : #{aluno.edicao.titulo}"></title>
</head>
<body>
<section layout:fragment="corpo">
    <div class="container" style="margin-top: 20px;">
        <h2 th:text="${aluno.id == null} ? #{aluno.cadastro.titulo} : #{aluno.edicao.titulo}"></h2>

        <form th:action="${aluno.id == null} ? @{/alunos/salvar} : @{/alunos/editar}"
              th:object="${aluno}" method="post">
            
            <div th:replace="~{fragments/alert :: alert}"></div>
            <input type="hidden" th:field="*{id}"/>

            <div class="form-group">
                <label for="nome" th:text="#{aluno.label.nome}"></label>
                <input type="text" class="form-control" id="nome" th:field="*{nome}" required="required"/>
                <div th:replace="~{fragments/validacao :: alert('nome', 'Favor informar o nome')}"></div>
            </div>
            
            <div class="form-group">
                <label for="cpf" th:text="#{aluno.label.cpf}"></label>
                <input type="text" class="form-control" id="cpf" th:field="*{cpf}" required="required"
                       th:readonly="${aluno.id != null}"/>
                <div th:replace="~{fragments/validacao :: alert('cpf', 'Favor informar o CPF')}"></div>
            </div>

            <div class="form-group">
                <label for="email" th:text="#{aluno.label.email}"></label>
                <input type="email" class="form-control" id="email" th:field="*{email}" required="required"/>
                <div th:replace="~{fragments/validacao :: alert('email', 'Favor informar o email')}"></div>
            </div>
            
            <div class="form-group">
                <label for="telefone" th:text="#{aluno.label.telefone}"></label>
                <input type="text" class="form-control" id="telefone" th:field="*{telefone}"/>
            </div>
            
            <div class="form-group">
                <label for="endereco" th:text="#{aluno.label.endereco}"></label>
                <input type="text" class="form-control" id="endereco" th:field="*{endereco}"/>
            </div>

            <div class="form-group">
                <label for="dataNascimento" th:text="#{aluno.label.dataNascimento}"></label>
                <input type="date" class="form-control" id="dataNascimento" th:field="*{dataNascimento}" required="required"/>
                <div th:replace="~{fragments/validacao :: alert('dataNascimento', 'Favor informar a data de nascimento')}"></div>
            </div>
            
            <div class="form-row">
                <div class="form-group col-md-6">
                    <label for="altura" th:text="#{aluno.label.altura}"></label>
                    <input type="number" step="0.01" class="form-control" id="altura" th:field="*{altura}" required="required"/>
                    <div th:replace="~{fragments/validacao :: alert('altura', 'Favor informar a altura')}"></div>
                </div>
                <div class="form-group col-md-6">
                    <label for="peso" th:text="#{aluno.label.peso}"></label>
                    <input type="number" step="0.01" class="form-control" id="peso" th:field="*{peso}" required="required"/>
                    <div th:replace="~{fragments/validacao :: alert('peso', 'Favor informar o peso')}"></div>
                </div>
            </div>
            
            <div class="form-group">
                <label for="objetivo" th:text="#{aluno.label.objetivo}"></label>
                <input type="text" class="form-control" id="objetivo" th:field="*{objetivo}"/>
            </div>

            <button type="submit" class="btn btn-primary" th:text="#{botao.salvar}"></button>
        </form>
    </div>
</section>
</body>
</html>
