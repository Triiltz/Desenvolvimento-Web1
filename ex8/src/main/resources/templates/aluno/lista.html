<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title th:text="#{aluno.lista.titulo}"></title>
</head>
<body>
<section layout:fragment="corpo">
    <div class="container" style="margin-top: 20px;">
        <h2 th:text="#{aluno.lista.titulo}"></h2>

        <div th:replace="~{fragments/alert :: alert}"></div>

        <div class="table-responsive">
            <a th:href="@{/alunos/cadastrar}" class="btn btn-primary btn-md mb-3">
                <i class="oi oi-plus"></i> <span th:text="#{botao.novo}"></span>
            </a>
            <table class="table table-striped table-hover table-sm">
                <thead>
                <tr>
                    <th>ID</th>
                    <th th:text="#{aluno.label.nome}"></th>
                    <th th:text="#{aluno.label.cpf}"></th>
                    <th th:text="#{aluno.label.email}"></th>
                    <th th:text="#{aluno.label.acoes}"></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="aluno : ${alunos}">
                    <td th:text="${aluno.id}"></td>
                    <td th:text="${aluno.nome}"></td>
                    <td th:text="${aluno.cpf}"></td>
                    <td th:text="${aluno.email}"></td>
                    <td colspan="2">
                        <a class="btn btn-info btn-sm" th:href="@{/alunos/editar/{id}(id=${aluno.id})}" role="button">
                            <span class="oi oi-brush" th:title="#{botao.editar}"></span>
                        </a>
                        <a class="btn btn-danger btn-sm" href="#" role="button" data-toggle="modal" data-target=".modal"
                                th:onclick="|definirUrlExclusao('@{/alunos/excluir/{id}(id=${aluno.id})}')|">
                            <span class="oi oi-circle-x" th:title="#{botao.remover}"></span>
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</body>
</html>
