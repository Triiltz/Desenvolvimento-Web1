<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title th:text="#{plano.lista.titulo}"></title>
</head>
<body>
<section layout:fragment="corpo">
    <div class="container" style="margin-top: 20px;">
        <h2 th:text="#{plano.lista.titulo}"></h2>

        <div th:replace="~{fragments/alert :: alert}"></div>

        <div class="table-responsive">
            <a th:href="@{/planos/cadastrar}" class="btn btn-primary btn-md mb-3">
                <i class="oi oi-plus"></i> <span th:text="#{botao.novo}"></span>
            </a>
            <table class="table table-striped table-hover table-sm">
                <thead>
                <tr>
                    <th th:text="#{plano.label.id}">ID</th>
                    <th th:text="#{plano.label.nome}">Nome do Treino</th>
                    <th th:text="#{plano.label.aluno}">Aluno</th>
                    <th th:text="#{plano.label.dataInicio}">Data de Início</th>
                    <th th:text="#{plano.label.dataFim}">Data de Fim</th>
                    <th th:text="#{plano.label.acoes}">Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="plano : ${planos}">
                    <td th:text="${plano.id}"></td>
                    <td th:text="${plano.nomeTreino}"></td>
                    <td th:text="${plano.aluno.nome}"></td>
                    <td th:text="${#temporals.format(plano.dataInicio, 'dd/MM/yyyy')}"></td>
                    <td th:text="${#temporals.format(plano.dataFim, 'dd/MM/yyyy')}"></td>
                    <td colspan="2">
                        <a class="btn btn-info btn-sm" th:href="@{/planos/editar/{id}(id=${plano.id})}" role="button">
                            <span class="oi oi-brush" th:title="#{botao.editar}" aria-hidden="true"></span>
                        </a>
                        <a class="btn btn-danger btn-sm" href="#" role="button" data-toggle="modal" data-target=".modal"
                                th:onclick="|definirUrlExclusao('@{/planos/excluir/{id}(id=${plano.id})}')|">
                            <span class="oi oi-circle-x" th:title="#{botao.remover}"></span>
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</body>
</html>
