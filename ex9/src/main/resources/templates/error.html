<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title th:text="#{error.title}">Ocorreu um Erro</title>
    <link th:href="@{/webjars/bootstrap/4.4.1-1/css/bootstrap.min.css}" rel="stylesheet"/>
    <link th:href="@{/webjars/open-iconic/1.1.1/font/css/open-iconic-bootstrap.min.css}" rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>		
<body class="text-center" style="padding: 50px;">
	<div>
		<h1 class="h3 mb-3 font-weight-normal">
			<i class="oi oi-warning"></i> 
			<span th:text="${status}"></span>
		</h1>
		<h2 th:text="#{${error}}"></h2>
		<hr/>
		<div>
			<span th:text="#{${message}}"></span><br/><br/>
			<a class="btn btn-primary" href="javascript:history.back()">
                <span th:text="#{botao.voltar}"></span>
            </a>
		</div>
	</div>
</body>
</html>
